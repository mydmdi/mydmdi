<!doctype html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1600px;height:400px;overflow:hidden}
  body{
    background:
      radial-gradient(900px 380px at 90% -20%, rgba(15,110,88,.5), transparent 70%),
      radial-gradient(520px 260px at 0% 130%, rgba(240,120,60,.16), transparent 70%),
      #0A0D0C;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    color:#F2F5F3;position:relative}
  .edge{position:absolute;left:0;top:0;bottom:0;width:6px;
    background:linear-gradient(180deg,#57D9AE,#0F6E58 55%,#F0783C)}
  .kicker{position:absolute;left:72px;top:56px;display:flex;align-items:center;gap:14px;
    font:600 14px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.22em;
    text-transform:uppercase;color:#57D9AE}
  .kicker i{width:12px;height:12px;border-radius:50%;background:#57D9AE;
    box-shadow:0 0 0 5px rgba(87,217,174,.14);display:block}
  h1{position:absolute;left:72px;top:104px;font-size:88px;line-height:1.02;
    letter-spacing:-.045em;font-weight:680;max-width:1150px}
  h1 span{color:#57D9AE}
  .rule{position:absolute;left:72px;top:300px;width:190px;height:4px;border-radius:2px;
    background:linear-gradient(90deg,#57D9AE,#57D9AE 50%,#F0783C)}
  .sub{position:absolute;left:72px;top:328px;font-size:24px;line-height:1.45;
    letter-spacing:-.01em;color:#C9D3CE;max-width:900px}
  .meta{position:absolute;right:72px;bottom:44px;text-align:right;line-height:1.85;
    font:500 14px/1.85 ui-monospace,SFMono-Regular,Menlo,monospace;color:#86958E;letter-spacing:.05em}
  .meta b{color:#E8EFEB;font-weight:600;letter-spacing:.02em}
</style></head>
<body>
  <div class="edge"></div>
  <div class="kicker"><i></i>Technology &amp; design</div>
  <h1>Computing that <span>belongs</span><br>to the community.</h1>
  <div class="rule"></div>
  <p class="sub">Solar-powered infrastructure, AI custodians and civic tools —<br>built in Saskatchewan, for public good.</p>
  <div class="meta"><b>mydmdi.com</b><br>Regina · Treaty 4 territory</div>
</body></html>
